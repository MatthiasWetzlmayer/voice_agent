[project]
name = "voice-assistant"
version = "0.1.0"
description = "Sprachassistent: Voice-Agent (LangChain) + Task-Agent (DeepAgents)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.4",
    "langchain-openai>=1.0",
    "langchain-ollama>=1.1",
    "langgraph>=1.2",
    "deepagents>=0.7",
    "openai[realtime]>=2.0",
    "python-dotenv>=1.0",
    "sounddevice>=0.5",
]

[project.scripts]
voice-assistant = "voice_assistant.main:run"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_assistant"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
